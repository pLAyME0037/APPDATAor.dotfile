# Qt Apps (VLC, OBS, qBittorrent, etc.)
env = QT_SCALE_FACTOR, 1.25

# GTK Apps (Thunar, GNOME apps, etc.)
# Note: GTK does not support fractional UI scaling perfectly. 
# GDK_SCALE only takes integers (1, 2). 
# GDK_DPI_SCALE scales fonts and some elements.
env = GDK_DPI_SCALE, 1.25

# Electron/Chromium (Discord, VS Code, Chrome)
# You can force these to scale via a flag or environment variable
env = ELECTRON_OZONE_PLATFORM_HINT, auto

discord --force-device-scale-factor=1.25
code --force-device-scale-factor=1.25
google-chrome-stable --force-device-scale-factor=1.25
Telegram --force-device-scale-facte=or=1
