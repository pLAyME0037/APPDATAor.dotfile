#############
# GENERAL
#############

[general]
# Grab keyboard focus when opened
grab_focus = true

# Always stay on top
always_on_top = true

# Window size (width height)
window_size = 600 300

# Position on screen: top / center / bottom
position = center

# Rounded corners (larger = more round)
rounding = 14

# Enable HAIRLINE border for nicer look (if supported)
border = true

# Font settings
font = "FiraCode Nerd Font"
font_size = 15

# Colors (overrides? toolkit theme may override)
bg_color = "#1E1E2E"
fg_color = "#D9E0EE"
highlight_color = "#89B4FA"
accent_color = "#ABE9B3"

# Animation
animation_duration = 180

# Max results in the main list
max_results = 10

# Enable shadows (if toolkit supports)
shadow = true
shadow_blur = 12

#############
# FINDERS
#############

[finders]
# Default finder (no prefix)
default_finder = desktop

# Prefixes for special finders
unicode_prefix = .
math_prefix = =
clipboard_prefix = >

#############
# MAIN / DESKTOP
#############

[finders.desktop]
# Search desktop/applications
exec_cmd = {}

# Show icons if available
desktop_icons = true

# Sort alphabetical (or frequency)
sort = alphabetical

# Show a separator line for categories
show_categories = true

#############
# UNICODE (with emoji previews)
#############

[finders.unicode]
# Unicode search
search_cmd = {}

# Max results for Unicode
max_results = 15

# If your hyprtoolkit theme supports it, emoji symbols will show
emoji_preview = true

################
# MATH
################

[finders.math]
# Math evaluation
eval_cmd = {}

# Max entries
max_results = 8

################
# CLIPBOARD
################

[finders.clipboard]
# Clipboard history finder
max_results = 12

